services:
  - type: web
    name: quickeee-luxury-stylist
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CATALOG_PATH
        value: data/catalog.seed.json
      - key: VECTOR_BACKEND
        value: local_json
      - key: ALLOW_LOCAL_VECTOR_FALLBACK
        value: true
      - key: LLM_PROVIDER
        value: local
