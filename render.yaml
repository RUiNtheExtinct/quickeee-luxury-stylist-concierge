services:
  - type: web
    name: quickeee-luxury-stylist
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CATALOG_PATH
        value: data/catalog.seed.json
      - key: CACHE_NAMESPACE
        value: style-agent-v3
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSIONS
        value: 384
      - key: ALLOW_EMBEDDING_FALLBACK
        value: true
      - key: VECTOR_BACKEND
        value: qdrant
      - key: QDRANT_URL
        value: https://7da89e24-93f6-48a6-9ff7-8a3f8116d012.us-east-1-1.aws.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: quickeee_catalog
      - key: QDRANT_RECREATE_ON_STARTUP
        value: false
      - key: ALLOW_LOCAL_VECTOR_FALLBACK
        value: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
